name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.25.x"]
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7
        with:
          path: daemon

      - uses: actions/checkout@v7
        with:
          repository: hiveryn/shared
          path: shared

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.8.0
          working-directory: daemon
